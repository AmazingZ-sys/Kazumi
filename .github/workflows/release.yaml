name: Fork packages and releases

on:
  push:
    branches:
      - main
      - feat/drama-olevod
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      platform:
        description: Packages to build
        type: choice
        required: true
        default: all
        options:
          - all
          - windows

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Tests, analyzer, and release version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      flutter_version: ${{ steps.flutter.outputs.VERSION }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate package and release versions
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="$(python3 scripts/release_metadata.py version --tag "$RELEASE_TAG")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Select package platforms
        id: platforms
        env:
          BUILD_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          platforms = [
              {'name': 'Android', 'platform': 'android', 'artifact': 'android', 'runner': 'ubuntu-latest'},
              {'name': 'iOS', 'platform': 'ipa', 'artifact': 'ios', 'runner': 'macos-latest'},
              {'name': 'macOS', 'platform': 'macos', 'artifact': 'macos', 'runner': 'macos-latest'},
              {'name': 'Windows', 'platform': 'windows', 'artifact': 'windows', 'runner': 'windows-latest'},
          ]
          if os.environ['BUILD_PLATFORM'] == 'windows':
              platforms = [platform for platform in platforms if platform['platform'] == 'windows']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps({'include': platforms}) + '\n')
          PY
      - name: Run packaging and release metadata tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Set up Flutter
        id: flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Run Flutter tests
        run: flutter test
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --fatal-warnings

  build:
    name: Package ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      # Windows redirects Python output using a legacy code page by default.
      PYTHONUTF8: '1'
      # Optional service credentials; empty values do not prevent packaging.
      DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
      DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
      KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
      KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}
      UPDATE_REPOSITORY: ${{ github.repository }}
      PACKAGE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Windows packaging and Authenticode tests
        if: matrix.platform == 'windows'
        run: python -m unittest discover -s scripts/tests -v
      - name: Set up JDK 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android native build tools
        if: matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Prepare persistent Android signing key
        id: android_signing
        if: matrix.platform == 'android'
        env:
          KAZUMI_ANDROID_KEYSTORE_BASE64: ${{ secrets.KAZUMI_ANDROID_KEYSTORE_BASE64 }}
          KAZUMI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KAZUMI_ANDROID_KEYSTORE_PASSWORD }}
          KAZUMI_ANDROID_KEY_ALIAS: ${{ secrets.KAZUMI_ANDROID_KEY_ALIAS }}
          KAZUMI_ANDROID_KEY_PASSWORD: ${{ secrets.KAZUMI_ANDROID_KEY_PASSWORD }}
          REQUIRE_RELEASE_KEY: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ('KAZUMI_ANDROID_KEYSTORE_BASE64', 'KAZUMI_ANDROID_KEYSTORE_PASSWORD',
                   'KAZUMI_ANDROID_KEY_ALIAS', 'KAZUMI_ANDROID_KEY_PASSWORD')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              if os.environ['REQUIRE_RELEASE_KEY'] == 'true':
                  raise SystemExit('Tagged Android releases require repository secrets: ' + ', '.join(missing))
              print('::warning::Android signing secrets are incomplete; this Actions artifact uses the development debug key.')
          else:
              destination = Path(os.environ['RUNNER_TEMP']) / 'kazumi-release.jks'
              destination.write_bytes(base64.b64decode(os.environ[names[0]], validate=True))
              destination.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
                  output.write(f'KAZUMI_ANDROID_KEYSTORE={destination}\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('enabled=true\n')
          PY
      - name: Install Apple native build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - name: Locate or install Inno Setup
        id: inno
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $iscc) { $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1 }
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Could not locate Inno Setup 6 ISCC.exe' }
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Set up Flutter
        id: flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: ${{ needs.validate.outputs.flutter_version }}
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Preserve Android JNI linker compatibility
        if: matrix.platform == 'android'
        env:
          FLUTTER_PUB_CACHE: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          for source in Path(os.environ['FLUTTER_PUB_CACHE']).glob('hosted/pub.dev/jni-*/src/CMakeLists.txt'):
              content = source.read_text(encoding='utf-8')
              if '-Wl,--build-id=none,' not in content:
                  source.write_text(content.replace('-Wl,', '-Wl,--build-id=none,'), encoding='utf-8')
          PY
      - name: Build and package
        if: matrix.platform != 'windows'
        env:
          KAZUMI_ANDROID_KEYSTORE_PASSWORD: ${{ steps.android_signing.outputs.enabled == 'true' && secrets.KAZUMI_ANDROID_KEYSTORE_PASSWORD || '' }}
          KAZUMI_ANDROID_KEY_ALIAS: ${{ steps.android_signing.outputs.enabled == 'true' && secrets.KAZUMI_ANDROID_KEY_ALIAS || '' }}
          KAZUMI_ANDROID_KEY_PASSWORD: ${{ steps.android_signing.outputs.enabled == 'true' && secrets.KAZUMI_ANDROID_KEY_PASSWORD || '' }}
        run: >-
          python scripts/package.py
          --platform "$PACKAGE_PLATFORM"
          --output packages
          --skip-pub-get
      - name: Build, sign, and verify Windows packages
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          KAZUMI_WINDOWS_PFX_BASE64: ${{ secrets.KAZUMI_WINDOWS_PFX_BASE64 }}
          KAZUMI_WINDOWS_PFX_PASSWORD: ${{ secrets.KAZUMI_WINDOWS_PFX_PASSWORD }}
          KAZUMI_WINDOWS_CERT_SHA256: ${{ secrets.KAZUMI_WINDOWS_CERT_SHA256 }}
          KAZUMI_ISCC: ${{ steps.inno.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('KAZUMI_WINDOWS_PFX_BASE64', 'KAZUMI_WINDOWS_PFX_PASSWORD', 'KAZUMI_WINDOWS_CERT_SHA256')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Windows packages require repository secret $name"
            }
          }
          $publicFingerprint = (Get-FileHash -LiteralPath certificates/windows-self-signed.cer -Algorithm SHA256).Hash
          if ($publicFingerprint -ne $env:KAZUMI_WINDOWS_CERT_SHA256) {
            throw 'Windows certificate fingerprint secret must match the committed public certificate'
          }
          $env:KAZUMI_WINDOWS_PFX = Join-Path $env:RUNNER_TEMP 'kazumi-release.pfx'
          [IO.File]::WriteAllBytes($env:KAZUMI_WINDOWS_PFX, [Convert]::FromBase64String($env:KAZUMI_WINDOWS_PFX_BASE64))
          Remove-Item Env:KAZUMI_WINDOWS_PFX_BASE64
          python scripts/package.py --platform windows --output packages --windows-format both --iscc "$env:KAZUMI_ISCC" --skip-pub-get
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging or signing failed' }
          $artifacts = @(python scripts/release_metadata.py artifacts --directory packages --platform windows)
          if ($LASTEXITCODE -ne 0) { throw 'Could not select the exact Windows packages' }
          $installer = $artifacts | Where-Object { $_.EndsWith('_windows_x64_setup.exe') }
          $portable = $artifacts | Where-Object { $_.EndsWith('_windows_x64.zip') }
          $verification = Join-Path $env:RUNNER_TEMP 'kazumi-signature-check'
          Expand-Archive -LiteralPath $portable -DestinationPath $verification -Force
          foreach ($file in @($installer, (Join-Path $verification 'kazumi.exe'))) {
            pwsh -NoProfile -NonInteractive -File scripts/sign_windows.ps1 -Mode verify -FilePath "$file"
            if ($LASTEXITCODE -ne 0) { throw 'Windows artifact signature verification failed' }
          }
      - name: Select the exact packages
        id: package
        run: |
          artifacts="$(python scripts/release_metadata.py artifacts --directory packages --platform "$PACKAGE_PLATFORM")"
          printf 'paths<<KAZUMI_PACKAGE_PATHS\n%s\nKAZUMI_PACKAGE_PATHS\n' "$artifacts" >> "$GITHUB_OUTPUT"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-package-${{ matrix.artifact }}-${{ needs.validate.outputs.version }}
          path: ${{ steps.package.outputs.paths }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove Android signing material
        if: always() && matrix.platform == 'android'
        run: rm -f "$RUNNER_TEMP/kazumi-release.jks"
      - name: Remove Windows signing material
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'kazumi-release.pfx') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'kazumi-signature-check') -Recurse -Force -ErrorAction SilentlyContinue

  publish:
    name: Publish stable fork release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Download all five packages
        uses: actions/download-artifact@v4
        with:
          pattern: kazumi-package-*-${{ needs.validate.outputs.version }}
          path: release-artifacts
          merge-multiple: true
      - name: Validate all packages and generate checksums
        run: |
          python3 scripts/release_metadata.py checksums --directory release-artifacts --tag "$RELEASE_TAG"
          cd release-artifacts
          sha256sum --check SHA256SUMS
      - name: Write release notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Kazumi $RELEASE_TAG is built from this fork's tagged source, based on upstream 2.3.9.

          - Android APK: signed with this fork's persistent release key. Existing upstream installations use a different key and require uninstalling before switching to this fork; back up your data first.
          - iOS IPA: no distribution signature; re-sign and sideload it with your own provisioning method.
          - macOS DMG: the app uses an ad-hoc signature and is not Apple-notarized. macOS may require approval in Privacy & Security.
          - Windows EXE and ZIP: x64 installer and portable build signed with this fork's persistent self-signed certificate. Windows may show an untrusted publisher or SmartScreen warning. Extract the whole ZIP before running kazumi.exe.

          SHA256SUMS records the SHA-256 of all five packages. In-app Windows updates keep using the portable ZIP from this fork's GitHub Releases.
          EOF
      - name: Publish packages and SHA256SUMS
        run: >-
          gh release create "$RELEASE_TAG"
          release-artifacts/Kazumi_*
          release-artifacts/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Kazumi $RELEASE_TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --latest
