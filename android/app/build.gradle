plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing is supplied by the fork's Actions secrets or local env.
// Never store keystores or passwords in this repository.
def forkKeystore = System.getenv('KAZUMI_ANDROID_KEYSTORE')
def forkStorePassword = System.getenv('KAZUMI_ANDROID_KEYSTORE_PASSWORD')
def forkKeyAlias = System.getenv('KAZUMI_ANDROID_KEY_ALIAS')
def forkKeyPassword = System.getenv('KAZUMI_ANDROID_KEY_PASSWORD')
def forkSigningConfigured = forkKeystore && forkStorePassword && forkKeyAlias && forkKeyPassword
if ([forkKeystore, forkStorePassword, forkKeyAlias, forkKeyPassword].any { it } && !forkSigningConfigured) {
    throw new GradleException('Incomplete fork release signing environment')
}

android {
    namespace "com.example.kazumi"
    compileSdk flutter.compileSdkVersion
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.predidit.kazumi"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        forkRelease {
            if (forkSigningConfigured) {
                storeFile file(forkKeystore)
                storePassword forkStorePassword
                keyAlias forkKeyAlias
                keyPassword forkKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig forkSigningConfigured ? signingConfigs.forkRelease : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

// F-droid splits APKs by ABI, and requires different versionCode for each ABI.
// For flutter version X.Y.Z, version code is X0Y0ZA, where A is the ABI code.
// See:
// * https://developer.android.com/build/gradle-tips
// * https://developer.android.com/studio/build/configure-apk-splits
// * https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/im.nfc.nfsee.yml
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
